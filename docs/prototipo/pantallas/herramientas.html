<template data-id="herramientas" data-titulo="Herramientas">
  <div class="pant">

    <div class="cab">
      <div>
        <h1>Herramientas</h1>
        <p>Agrupadas por lo que te resuelven. <b>Cuatro</b> te piden algo esta semana.</p>
      </div>
    </div>

    <div class="rejilla llena" style="--cols: minmax(0,0.6fr) minmax(0,1fr) minmax(0,1fr)">

      <!-- CONTROLAR EL MES -->
      <div style="display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0">
        <h2 class="titulo">Controlar el mes</h2>
        <p class="nota solo-escritorio" style="margin:0">Que lo del mes alcance y no se vaya en cobros que no usas.</p>
      </div>
      <div class="par ancho-2" style="gap:14px">
        <div class="panel" data-ir="lista-compras" role="link" tabindex="0">
          <div class="panel-cab" style="flex-wrap:wrap"><b>Lista de compras</b></div>
          <div><span class="cifra-m">$305.600</span> <span class="de">en tu lista</span></div>
          <div class="fila solo-escritorio" style="margin-top:auto"><span class="nota">Mercado tiene <b>$580.000</b> · para el 15 nov</span><span class="link acento">Abrir →</span></div>
        </div>
        <div class="panel" data-ir="suscripciones" role="link" tabindex="0">
          <div class="panel-cab" style="flex-wrap:wrap"><b>Suscripciones</b><span class="chip mal">1 fuga</span></div>
          <div><span class="cifra-m">$157.600</span> <span class="de">al mes</span></div>
          <div class="fila solo-escritorio" style="margin-top:auto"><span class="nota">Smart Fit: 47 días sin uso, <b>$89.900</b> al mes</span><span class="link acento">Abrir →</span></div>
        </div>
      </div>

      <!-- PROTEGERME -->
      <div style="display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0">
        <h2 class="titulo">Protegerme</h2>
        <p class="nota solo-escritorio" style="margin:0">Que las deudas no vuelvan y el banco no te cobre de más.</p>
      </div>
      <div class="par ancho-2" style="gap:14px">
        <div class="panel" data-ir="anti-recaida" role="link" tabindex="0">
          <div class="panel-cab" style="flex-wrap:wrap"><b>Anti-recaída</b></div>
          <div><span class="cifra-m">$26.900</span> <span class="de">apartados</span></div>
          <div class="fila solo-escritorio" style="margin-top:auto"><span class="nota">Tarjetas a 1 cuota · $0 de intereses</span><span class="link acento">Abrir →</span></div>
        </div>
        <div class="panel" data-ir="auditor" role="link" tabindex="0">
          <div class="panel-cab" style="flex-wrap:wrap"><b>Auditor bancario</b><span class="chip aviso">Falta radicar</span></div>
          <div><span class="cifra-m">$334.000</span> <span class="de">al año</span></div>
          <div class="fila solo-escritorio" style="margin-top:auto"><span class="nota">Por rescatar: seguro deudor y cuota de manejo</span><span class="link acento">Abrir →</span></div>
        </div>
      </div>

      <!-- CRECER -->
      <div style="display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0">
        <h2 class="titulo">Crecer</h2>
        <p class="nota solo-escritorio" style="margin:0">Que tu plata trabaje y adelante tu retiro.</p>
      </div>
      <div class="par ancho-2" style="gap:14px">
        <div class="panel" data-ir="activos" role="link" tabindex="0">
          <div class="panel-cab" style="flex-wrap:wrap"><b>Activos y F.I.R.E.</b><span class="chip acento">Por invertir</span></div>
          <div><span class="cifra-m">$805.600</span> <span class="de">invertidos</span></div>
          <div class="fila solo-escritorio" style="margin-top:auto"><span class="nota">Retiro en ago 2053 · <b>$400.000</b> en tu sobre</span><span class="link acento">Abrir →</span></div>
        </div>
        <div class="panel" data-ir="retos" role="link" tabindex="0">
          <div class="panel-cab" style="flex-wrap:wrap"><b>Retos</b><span class="chip acento">Aporta $24.000</span></div>
          <div><span class="cifra-m">2</span> <span class="de">activos</span></div>
          <div class="fila solo-escritorio" style="margin-top:auto"><span class="nota">Semana 12 de 52 · día 9 de 21 sin domicilios</span><span class="link acento">Abrir →</span></div>
        </div>
      </div>

      <!-- VER CÓMO VOY -->
      <div style="display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0">
        <h2 class="titulo">Ver cómo voy</h2>
        <p class="nota solo-escritorio" style="margin:0">Tu puntaje y el cierre de cada mes.</p>
      </div>
      <div class="par ancho-2" style="gap:14px">
        <div class="panel" data-ir="salud" role="link" tabindex="0">
          <div class="panel-cab" style="flex-wrap:wrap"><b>Salud financiera</b></div>
          <div><span class="cifra-m">70</span> <span class="de">de 100</span></div>
          <div class="fila solo-escritorio" style="margin-top:auto"><span class="nota">Lo que más te sube: llenar el fondo</span><span class="link acento">Abrir →</span></div>
        </div>
        <div class="panel" data-ir="reportes" role="link" tabindex="0">
          <div class="panel-cab" style="flex-wrap:wrap"><b>Reportes</b></div>
          <div><span class="cifra-m">$101.700</span> <span class="de">sobró en oct.</span></div>
          <div class="fila solo-escritorio" style="margin-top:auto"><span class="nota">Balance de octubre listo</span><span class="link acento">Abrir →</span></div>
        </div>
      </div>

    </div>
  </div>
</template>
