<template data-id="mi-plata" data-titulo="Mi plata">

          <div class="barra" style="display:flex;gap:2px" role="img" aria-label="$1.600.000 en sobres y $1.540.000 sin sobre">
            <i style="width:51%;--c:var(--acento)"></i><i style="width:49%;--c:var(--texto-3)"></i>
          </div>
          <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <span class="nota"><span class="bola" style="--c:var(--acento)"></span> <b>$1.600.000</b> en sobres</span>
            <span class="nota"><span class="bola" style="--c:var(--texto-3)"></span> <b>$1.540.000</b> sin sobre</span>
          </div>
        </div>
        <div class="lista lineas">
          <div style="display:flex;align-items:center;gap:12px">
            <span class="inicial">BC</span>
            <div style="flex:1;min-width:0"><div class="fila"><span>Bancolombia</span><span>$1.450.000</span></div><div class="nota suave">$400.000 en sobre Inversión · $1.050.000 sin sobre</div></div>

            <span class="inicial">NQ</span>
            <div style="flex:1;min-width:0"><div class="fila"><span>Nequi</span><span>$310.000</span></div><div class="nota suave">$310.000 sin sobre</div></div>
          </div>
          <div style="display:flex;align-items:center;gap:12px">
            <span class="inicial">EF</span>
            <div style="flex:1;min-width:0"><div class="fila"><span>Efectivo</span><span>$180.000</span></div><div class="nota suave">$180.000 sin sobre</div></div>
          </div>
        </div>

        <div class="solo-escritorio" style="border-top:1px solid var(--hairline);padding-top:12px;display:flex;flex-direction:column;gap:10px">
          <div class="panel-cab"><h2 class="titulo">Tus tarjetas, a 1 cuota</h2><button class="link" data-ir="anti-recaida">Anti-recaída →</button></div>

      </section>

      <!-- Patrimonio e inversiones -->
      <section class="panel">
        <div class="rejilla" style="--cols: minmax(0,1fr) minmax(0,1fr); gap:24px">

            <h2 class="titulo">Tu patrimonio neto</h2>
            <div class="cifra-xl">$3.945.600</div>
            <div class="lista solo-escritorio" style="gap:8px">
              <div class="fila"><span class="nota">En tus cuentas</span><span>$3.140.000</span></div>
              <div class="fila"><span class="nota">Invertido</span><span>+$805.600</span></div>
              <div class="fila"><span class="nota">Deudas</span><span class="ok">$0</span></div>
            </div>
            <div class="nota solo-movil">Tus cuentas + <b>$805.600</b> en tu CDT · <b>$0</b> en deudas. <button class="link acento" data-ir="activos">Ver en Activos →</button></div>

            <div class="panel-cab"><h2 class="titulo">Tus inversiones</h2><button class="link acento" data-ir="activos">Activos →</button></div>

              <div class="fila"><span class="nota">Rendimiento proyectado</span><span class="ok">+$42.998</span></div>
            </div>
          </div>
        </div>

      <!-- Movimientos de noviembre -->

        <table class="tabla">
          <thead><tr><th>Concepto</th><th class="opc">Cuenta</th><th style="width:92px">Tipo</th><th class="opc2" style="width:56px">Fecha</th><th style="width:100px">Monto</th></tr></thead>
          <tbody>
            <tr><td>Transporte de la semana</td><td class="opc">Efectivo</td><td><span class="pill gasto">Gasto</span></td><td class="opc2 num">6 nov</td><td class="num">−$22.000</td></tr>
            <tr><td>Spotify</td><td class="opc">Bancolombia</td><td><span class="pill gasto">Gasto</span></td><td class="opc2 num">5 nov</td><td class="num">−$16.900</td></tr>

            <tr class="solo-escritorio"><td>Mercado</td><td class="opc">Efectivo</td><td><span class="pill gasto">Gasto</span></td><td class="opc2 num">2 nov</td><td class="num">−$120.000</td></tr>
            <tr class="solo-escritorio"><td>A Fondo blindado</td><td class="opc">Bancolombia → Nu</td><td><span class="pill traslado">Traslado</span></td><td class="opc2 num">1 nov</td><td class="num">$400.000</td></tr>

            <tr class="solo-escritorio"><td>Salario quincena</td><td class="opc">Bancolombia</td><td><span class="pill ingreso">Ingreso</span></td><td class="opc2 num">1 nov</td><td class="num ok">+$1.600.000</td></tr>
          </tbody>
        </table>

    </div>
  </div>
</template>
